# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

#Disabling PHY 2Mbps (CONFIG_BT_CTLR_PHY_2M=n) helps to pair and connect for certain wireless chipset firmware versions, particularly on Windows (Realtek and Intel chips).
CONFIG_BT_CTLR_PHY_2M=n

# Enable deep sleep after 15 minutes of inactivity (timeout is in milliseconds).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable soft-off so the &soft_off behavior in the keymap is available.
# Wake the keyboard from soft-off with the on-board reset button.
CONFIG_ZMK_PM_SOFT_OFF=y
