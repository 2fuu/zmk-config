manifest:
  # NOTE: when ZMK ships a new stable tag, bump `revision` below AND the
  # matching `@v0.3` in .github/workflows/build.yml to keep firmware on a
  # reproducible release. See https://github.com/zmkfirmware/zmk/tags
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
  self:
    path: config
